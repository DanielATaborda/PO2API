<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <!-- Boxicons CSS -->
<link href='https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css' rel='stylesheet'>
<link href='https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css' rel='stylesheet'>
<link href='https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>

</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>POE 2</h1>
            <div class="logo-right">
                <p>Exile</p>
                <p>Trade</p>
                <p>Market</p>
            </div>
        </div>
        <hr>
        <div class="navegacao">
            <input type="Procure aqui" name="" id="" placeholder="Buscar Currency">
            <div class="navegacao-ligas">
                <p>Ligas</p>
                <select name="ligas" id="ligas-ativas">
                    <option selected value="Standard">Standard</option>
                    <option value="Runes%20of%20Aldur">Runes of Aldur</option>
                    <option value="Forbidden%20Rites">Forbidden Rites</option>
                </select>
            </div>
            <div class="navegacao-categorias">
                <p>Categoria</p>
                <select name="categoria" id="categoria">
                    <option value="Currency">Currency</option>
                    <option value="Fragments">Fragments</option>
                    <option value="Abyss">Abyss</option>
                    <option value="UncutGems">UncutGems</option>
                    <option value="LineageSupportGems">LineageSupportGems</option>
                    <option value="Essences">Essences</option>
                    <option value="SoulCores">SoulCores</option>
                    <option value="Idols">Idols</option>
                    <option value="Runes">Runes</option>
                    <option value="Ritual">Ritual</option>
                    <option value="Expedition">Expedition</option>
                    <option value="Delirium">Delirium</option>
                    <option value="Breach">Breach</option>
                    <option value="Verisium">Verisium</option>
                </select>
            </div>
            <div class="navegacao-ordenacao">
                <p>Ordenar por</p>
                <select name="ordenacao" id="ordenacao">
                    <option value="menorpreco">Menor Preço</option>
                </select>
            </div>
            <div class="navegacao-atualizar" id="botaoAtualizar">
                <svg class="svg-atualizar"  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
                 viewBox="0 0 24 24" >
                    <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                    <path d="M19.07 4.93a9.9 9.9 0 0 0-3.18-2.14A9.95 9.95 0 0 0 12 2v2c1.08 0 2.13.21 3.11.63.95.4 1.81.98 2.54 1.71s1.31 1.59 1.72 2.54c.42.99.63 2.03.63 3.11s-.21 2.13-.63 3.11c-.4.95-.98 1.81-1.72 2.54-.17.17-.34.32-.52.48L15 15.99v6h6l-2.45-2.45c.18-.15.36-.31.52-.48.92-.92 1.64-1.99 2.14-3.18.52-1.23.79-2.54.79-3.89s-.26-2.66-.79-3.89a9.9 9.9 0 0 0-2.14-3.18ZM4.93 19.07c.92.92 1.99 1.64 3.18 2.14 1.23.52 2.54.79 3.89.79v-2a7.9 7.9 0 0 1-3.11-.63c-.95-.4-1.81-.98-2.54-1.71s-1.31-1.59-1.72-2.54c-.42-.99-.63-2.03-.63-3.11s.21-2.13.63-3.11c.4-.95.98-1.81 1.72-2.54.17-.17.34-.32.52-.48L9 8.01V2H3l2.45 2.45c-.18.15-.36.31-.52.48-.92.92-1.64 1.99-2.14 3.18C2.27 9.34 2 10.65 2 12s.26 2.66.79 3.89c.5 1.19 1.22 2.26 2.14 3.18"></path>
                </svg>
                <p>Atualizar</p>
            </div>
        </div>
    </header>
    <div id="container">
    </div>
    <footer>
        
    </footer>
    <script type="module" src="./main.js"></script>
</body>
</html>
